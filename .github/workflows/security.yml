name: Security

# Gates on every push and pull request to main, plus a weekly full report:
#   secrets       gitleaks scans the new commits for passwords, keys and tokens; fails the run.
#                 Mondays (and on demand) it scans the whole history and reports without failing.
#   dependencies  npm audit of the site's dependencies: a critical advisory fails the run; the rest
#                 is listed in the run summary.
#   codeql        GitHub code scanning for the TypeScript (free for public repositories); findings
#                 show under Security → Code scanning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the new commits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            RANGE="-1 $HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "Scanning $RANGE"
          gitleaks git --log-opts="$RANGE" --redact --no-banner --exit-code 1
      - name: Scan the whole history (report)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          gitleaks git --redact --no-banner --exit-code 0 --report-format json --report-path gitleaks.json
          COUNT=$(node -e "console.log(require('./gitleaks.json').length)")
          {
            echo "### Secret scan of the whole history: $COUNT finding(s)"
            node -e "for (const f of require('./gitleaks.json')) console.log('- ' + f.RuleID + ' in ' + f.File + ' (' + f.Commit.slice(0, 7) + ')')"
          } >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fail on critical advisories in site dependencies
        run: npm audit --omit=dev --audit-level=critical --registry=https://registry.npmjs.org
      - name: List all advisories
        if: always()
        run: |
          {
            echo '### npm audit (site dependencies)'
            echo '```'
            npm audit --omit=dev --registry=https://registry.npmjs.org || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
